name: sysupdater
title: SysUpdater Pro

base: core22

version: '1.0.1'

summary: SysUpdater Pro - Simple System Package & Update Manager

description: |
  Aplikasi manajer pembaruan sistem, pembersih sampah,
  dan katalog aplikasi untuk Linux berbasis GTK3
  dengan dukungan multi-arsitektur.

license: GPL-3.0

contact: https://github.com/firdausiregar/sysupdater

grade: stable

confinement: classic


apps:
  sysupdater:
    command: usr/bin/sysupdater


parts:
  sysupdater:
    plugin: cmake

    source: .

    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr

    build-packages:
      - build-essential
      - cmake
      - pkg-config
      - libgtk-3-dev
      - libnotify-dev

    stage-packages:
      - libgtk-3-0
      - libnotify4